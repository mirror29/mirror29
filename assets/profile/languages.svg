<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img">
  <style>
    .title { fill: #70a5fd; font: 600 18px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .name { fill: #bf91f3; font: 600 20px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .label { fill: #38bdae; font: 600 13px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .text { fill: #a4aacb; font: 14px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .value { fill: #e4e7f2; font: 600 16px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
  </style>
  <rect x="1" y="1" width="418" height="228" rx="8" fill="#1a1b27" stroke="#30363d"/>
  <text x="24" y="38" class="title">Most Used Languages</text>
  <circle cx="30" cy="71" r="6" fill="#3572A5"/><text x="44" y="76" class="text">TypeScript</text><text x="385" y="76" text-anchor="end" class="value">42.9%</text>
  <circle cx="30" cy="101" r="6" fill="#3178C6"/><text x="44" y="106" class="text">JavaScript</text><text x="385" y="106" text-anchor="end" class="value">28.6%</text>
  <circle cx="30" cy="131" r="6" fill="#f1e05a"/><text x="44" y="136" class="text">Vue</text><text x="385" y="136" text-anchor="end" class="value">14.3%</text>
  <circle cx="30" cy="161" r="6" fill="#41b883"/><text x="44" y="166" class="text">Python</text><text x="385" y="166" text-anchor="end" class="value">7.1%</text>
  <circle cx="30" cy="191" r="6" fill="#e34c26"/><text x="44" y="196" class="text">HTML</text><text x="385" y="196" text-anchor="end" class="value">7.1%</text>
</svg>

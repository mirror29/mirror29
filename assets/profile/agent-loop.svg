<svg xmlns="http://www.w3.org/2000/svg" width="900" height="362" viewBox="0 0 900 362" role="img"><rect width="900" height="362" rx="16" fill="#101820"/><text x="28" y="35" font-family="Menlo,Consolas,monospace" font-size="15" fill="#d8ad70" font-weight="bold">INALPHA / THE EXPERIMENT LOOP</text><text x="28" y="62" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8b9daa" >Research → candidates → evidence → another iteration</text><rect x="28" y="91" width="187" height="100" rx="8" fill="#172630" stroke="#334650"/><text x="42" y="116" font-family="Menlo,Consolas,monospace" font-size="11" fill="#85c6ad" >01</text><text x="42" y="144" font-family="Menlo,Consolas,monospace" font-size="14" fill="#edf1eb" font-weight="bold">FREEZE</text><text x="42" y="169" font-family="Menlo,Consolas,monospace" font-size="11" fill="#a9b9c5" >data + budget</text><path d="M220 141h21l-5 -4m5 4l-5 4" fill="none" stroke="#85c6ad"/><rect x="247" y="91" width="187" height="100" rx="8" fill="#172630" stroke="#334650"/><text x="261" y="116" font-family="Menlo,Consolas,monospace" font-size="11" fill="#85c6ad" >02</text><text x="261" y="144" font-family="Menlo,Consolas,monospace" font-size="14" fill="#edf1eb" font-weight="bold">HYPOTHESIZE</text><text x="261" y="169" font-family="Menlo,Consolas,monospace" font-size="11" fill="#a9b9c5" >research context</text><path d="M439 141h21l-5 -4m5 4l-5 4" fill="none" stroke="#85c6ad"/><rect x="466" y="91" width="187" height="100" rx="8" fill="#172630" stroke="#334650"/><text x="480" y="116" font-family="Menlo,Consolas,monospace" font-size="11" fill="#85c6ad" >03</text><text x="480" y="144" font-family="Menlo,Consolas,monospace" font-size="14" fill="#edf1eb" font-weight="bold">COMPILE</text><text x="480" y="169" font-family="Menlo,Consolas,monospace" font-size="11" fill="#a9b9c5" >candidate strategy</text><path d="M658 141h21l-5 -4m5 4l-5 4" fill="none" stroke="#85c6ad"/><rect x="685" y="91" width="187" height="100" rx="8" fill="#172630" stroke="#334650"/><text x="699" y="116" font-family="Menlo,Consolas,monospace" font-size="11" fill="#85c6ad" >04</text><text x="699" y="144" font-family="Menlo,Consolas,monospace" font-size="14" fill="#edf1eb" font-weight="bold">EVALUATE</text><text x="699" y="169" font-family="Menlo,Consolas,monospace" font-size="11" fill="#a9b9c5" >backtest + feedback</text><path d="M779 195v30H340v-26m-4 5l4 -5l4 5" fill="none" stroke="#85c6ad" stroke-width="1.5"/><text x="414" y="246" font-family="Menlo,Consolas,monospace" font-size="11" fill="#85c6ad" >iterate with evaluation feedback</text><text x="28" y="286" font-family="Menlo,Consolas,monospace" font-size="13" fill="#d8ad70" >CANDIDATE → FORWARD / HOLDOUT → HUMAN ADOPTION</text><text x="28" y="313" font-family="Menlo,Consolas,monospace" font-size="12" fill="#a9b9c5" >Checkpoints · recovery · execution boundaries</text><text x="28" y="339" font-family="Menlo,Consolas,monospace" font-size="11" fill="#8b9daa" >Research-only adoption; no automatic strategy start or order placement.</text></svg>